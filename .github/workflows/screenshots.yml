name: App screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Blueberries/**'
      - 'BerrokuUITests/**'
      - 'Blueberries.xcodeproj/**'
      - 'scripts/capture-screenshots.sh'
      - '.github/workflows/screenshots.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Blueberries/**'
      - 'BerrokuUITests/**'
      - 'Blueberries.xcodeproj/**'
      - 'scripts/capture-screenshots.sh'
      - '.github/workflows/screenshots.yml'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Capture themed screenshots
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Capture screenshots
        run: scripts/capture-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: berroku-themed-screenshots
          path: build/screenshots/output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: berroku-screenshot-results
          path: build/screenshots/results/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
