name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'Blueberries/Resources/puzzles.json'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'Blueberries/Resources/puzzles.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint, and assemble
        working-directory: android
        run: ./gradlew :game-core:test :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: berroku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: berroku-android-reports
          path: |
            android/game-core/build/reports/tests/test/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
